name: MiniScheme ESP32 Firmware CI & Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-esp32:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Package Source Archive
      run: |
        zip -r minischeme-esp32-source.zip main components docs tools CMakeLists.txt partitions.csv sdkconfig.defaults README.md

    - name: Build firmware with ESP-IDF Docker
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v6.1   # the IDF the board firmware is built and tested with
        target: esp32
        path: '.'

    # The Release carries the committed firmware/ images: built with IDF 6.1
    # and tested on the board before the tag (a CI build cannot be byte-identical:
    # the app descriptor holds the build time). The CI build above proves the
    # tagged source compiles; this step proves firmware/ is complete and intact
    # and, for a tag, that its manifest names that version.
    - name: Package the committed firmware/ images
      run: |
        python3 tools/check_manifest.py firmware "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"
        mkdir -p release_bins
        cp firmware/bootloader.bin firmware/partition-table.bin firmware/minischeme_esp32.bin firmware/fontrom.bin firmware/firmware-manifest.json release_bins/
        cd release_bins
        zip -r ../minischeme-esp32-binaries.zip bootloader.bin partition-table.bin minischeme_esp32.bin fontrom.bin firmware-manifest.json
        cd ..

    - name: Upload Binary Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: minischeme-esp32-binaries
        path: |
          minischeme-esp32-source.zip
          minischeme-esp32-binaries.zip
          release_bins/bootloader.bin
          release_bins/partition-table.bin
          release_bins/minischeme_esp32.bin
          release_bins/fontrom.bin
          release_bins/firmware-manifest.json
        retention-days: 1   # storage quota: the Release keeps the files

    - name: Publish Release Assets (Source & Binaries Separated)
      # releases come only from a pushed version tag (git tag v1.0.X): no automatic tags
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: "MiniScheme ESP32 Firmware (${{ github.ref_name }})"
        make_latest: true
        files: |
          minischeme-esp32-source.zip
          minischeme-esp32-binaries.zip
          release_bins/bootloader.bin
          release_bins/partition-table.bin
          release_bins/minischeme_esp32.bin
          release_bins/fontrom.bin
          release_bins/firmware-manifest.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
